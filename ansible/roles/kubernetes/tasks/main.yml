---
- name: Clé du dépôt Kubernetes
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc

- name: Dépôt Kubernetes
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /"

- name: Installer kubelet, kubeadm et kubectl
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]

- name: Démarrer kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
