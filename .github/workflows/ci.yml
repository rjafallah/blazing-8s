name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B package -DskipTests
        working-directory: backend

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B test
        working-directory: backend

  docker-images:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build des deux images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/blazing-backend:latest ./backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/blazing-frontend:latest ./frontend
      # Les jobs tournent sur des machines différentes : on passe les images au job suivant
      - name: Sauvegarde des images
        run: docker save -o images.tar ${{ secrets.DOCKERHUB_USERNAME }}/blazing-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/blazing-frontend:latest
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar

  push-dockerhub:
    needs: docker-images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: images
      - run: docker load -i images.tar
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/blazing-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/blazing-frontend:latest
