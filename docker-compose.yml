version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: blazing_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jeux
    volumes:
      - ./backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: blazing_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jeux?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: blazing_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: